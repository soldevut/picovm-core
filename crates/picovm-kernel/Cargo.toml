[package]
name = "picovm-kernel"
version = "0.4.2"
edition = "2021"
description = "Sub-atomic WebAssembly runtime microkernel for autonomous AI agents on Solana"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/soldevut/picovm-core"

[dependencies]
wasmtime = { version = "18.0", default-features = false, features = ["cranelift", "runtime"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.36", features = ["full"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
solana-sdk = "1.18"
